name: Godot Project Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Check project parses and imports
        run: godot --headless --editor --path . --quit

      - name: Run headless startup smoke test
        run: timeout 20s godot --headless --path . --quit-after 5

      - name: Validate game content data
        run: timeout 30s godot --headless --path . --script res://tests/test_game.gd

      - name: Run gameplay integration tests
        run: timeout 30s godot --headless --path . --script res://tests/gameplay_test.gd

      - name: Upload project validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-report
          path: |
            project.godot
            scenes/main.tscn
            scripts/main.gd
            tests/README.md
          if-no-files-found: error
